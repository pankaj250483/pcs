<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pankaj Computers - Our Rising Stars</title>
  
  <!-- Bootstrap CSS -->
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/pcs.png">

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/3744db1db6.js" crossorigin="anonymous"></script>
  
  <!-- Vue 3 & AOS JS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <style>
    body {
      background-color: #ffffff !important;
    }

    .bg-dark {
      background-color: #1E5681 !important;
      color: #ffffff !important;
    }

    .col-md-4.bg-dark h3,
    .col-md-4.bg-dark p,
    .col-md-4.bg-dark span {
      color: #ffffff !important;
    }

    .col-md-4 img.w-100 {
      margin: 15px;
      border-radius: 5%;
      width: calc(100% - 30px) !important;
    }
    
    .h-fix {
       object-fit: cover; 
    }

    /* ---- Certificate card ---- */
    :root {
      --card-img-height: 360px; /* change this number to make the cards taller/shorter */
    }
    .star-card {
      height: auto;
      padding-bottom: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 8px;
      transition: transform .25s ease, box-shadow .25s ease;
      outline: none;
    }
    .star-card:hover, .star-card:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }
    .star-card:focus-visible { box-shadow: 0 0 0 4px #ffc107; }
    .star-card img.w-100 {
      height: var(--card-img-height);
      flex-shrink: 0;
      margin-bottom: 0;
    }
    .star-card h3 { margin-top: 1rem; }
    .flip-hint { font-size: 0.85rem; opacity: 0.75; }

    /* ---- Detail popup: description left, image right ---- */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .detail-box {
      position: relative;
      background: #1E5681;
      color: #fff;
      width: 100%;
      max-width: 1100px;
      max-height: 90vh;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .detail-text {
      flex: 1 1 45%;
      padding: 3rem 2.5rem;
      overflow-y: auto;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .detail-text h3 { margin-bottom: 1.2rem; }
    .detail-text p { font-size: 1.1rem; line-height: 1.7; margin: 0; }
    .detail-text .placement {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
      color: #ffc107;
    }
    .detail-image {
      flex: 1 1 55%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .detail-image img {
      max-width: 100%;
      max-height: calc(90vh - 30px);
      object-fit: contain;
      border-radius: 6px;
    }
    .detail-close {
      position: absolute;
      top: 10px;
      right: 14px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .detail-close:hover { background: #000; }
    @media (max-width: 767px) {
      .detail-box { flex-direction: column-reverse; overflow-y: auto; }
      .detail-text { padding: 1.5rem; flex: none; overflow: visible; }
      .detail-image { flex: none; }
      .detail-image img { max-height: 45vh; }
    }
    .fade-enter-active, .fade-leave-active { transition: opacity .25s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>

<body oncontextmenu="return false;" class="noselect">

  <!-- HEADER -->
  <include src="header.html"></include>

  <!-- Vue App Element -->
  <div id="app">
    <div class="container-fluid pt-3 bg-blue">
      <div class="row justify-content-around text-center">
        <div class="col-md-10 p-0">
          <p class="brain-text">Our Rising Stars</p>
        </div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="container-fluid text-center py-2 bg-blue sticky-top">
      <button 
        v-for="page in totalPages" 
        :key="page" 
        @click="changePage(page)"
        :class="['btn rounded-pill px-4 py-2 m-2', currentPage === page ? 'btn-primary' : 'btn-light']"
      >
        Rising Star (Page-{{ page }})
      </button>
    </div>

    <!-- Dynamic Sections Loop (Cards & Interspersed Videos) -->
    <template v-for="(section, sIndex) in activeSections" :key="sIndex">
      
      <!-- Video Section -->
      <div v-if="section.type === 'video'" class="container-fluid my-4">
        <div class="row justify-content-around text-center">
          <div class="col-md-9 py-3">
            <iframe 
              class="w-100" 
              style="height: 650px;" 
              :src="section.url"
              title="YouTube video player" 
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
            <div v-if="section.subtitle" class="mt-2">
              <span class="text-warning"><br>{{ section.subtitle }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Cards Grid Section -->
      <div v-else-if="section.type === 'cards'" class="container-fluid p-5">
        <div class="row g-4 justify-content-around text-center">
          <div 
            v-for="card in section.items" 
            :key="card.id" 
            class="col-md-4"
            data-aos="fade-up"
          >
            <div
              class="star-card bg-dark text-white"
              tabindex="0"
              role="button"
              @click="openCard(card)"
              @keydown.enter.prevent="openCard(card)"
              @keydown.space.prevent="openCard(card)"
            >
              <img :src="card.image" alt="Awarding Certificate" class="w-100 h-fix">
              <h3>AWARDING CERTIFICATE</h3>
              <span class="flip-hint">Click to read more</span>
            </div>
          </div>
          </div>
        </div>
      </div>

    </template>

    <!-- Detail popup -->
    <transition name="fade">
      <div v-if="selected" class="detail-overlay" @click.self="closeCard">
        <div class="detail-box" role="dialog" aria-modal="true">
          <button class="detail-close" @click="closeCard" aria-label="Close">&times;</button>
          <div class="detail-text">
            <h3>AWARDING CERTIFICATE</h3>
            <p>{{ selected.description }}</p>
            <span v-if="selected.placement" class="placement">{{ selected.placement }}</span>
          </div>
          <div class="detail-image">
            <img :src="selected.image" alt="Awarding Certificate">
          </div>
        </div>
      </div>
    </transition>
  </div>

  <!-- FOOTER -->
  <include src="footer.html"></include>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous">
  </script>

  <!-- Vue & AOS Handler -->
  <script>
    const { createApp, nextTick } = Vue;

    createApp({
      data() {
        return {
          currentPage: 1,
          totalPages: 3,
          pageData: {},
          selected: null
        };
      },
      computed: {
        activeSections() {
          return this.pageData[this.currentPage]?.sections || [];
        }
      },
      methods: {
        openCard(card) {
          this.selected = card;
          document.body.style.overflow = 'hidden';
        },
        closeCard() {
          this.selected = null;
          document.body.style.overflow = '';
        },
        changePage(pageNumber) {
          this.currentPage = pageNumber;
          this.closeCard();
          
          // Smooth scroll back to top of content when switching pages
          window.scrollTo({ top: 0, behavior: 'smooth' });

          // Re-initialize/refresh AOS animations on page switch
          this.$nextTick(() => {
            if (typeof AOS !== 'undefined') {
              AOS.refreshHard();
            }
          });
        }
      },
      mounted() {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && this.selected) this.closeCard();
        });
        // Load risingstar.json file dynamically
        fetch('risingstar.json')
          .then(response => response.json())
          .then(data => {
            this.pageData = data;
            
            // Initialize AOS once elements are rendered in DOM
            this.$nextTick(() => {
              AOS.init({
                duration: 800,
                once: true
              });
            });
          })
          .catch(error => console.error("Error fetching risingstar.json:", error));
      }
    }).mount('#app');

    // Header/Footer include script
    let includes = document.getElementsByTagName('include');
    for (var i = 0; i < includes.length; i++) {
      let include = includes[i];
      load_file(includes[i].attributes.src.value, function (text) {
        include.insertAdjacentHTML('afterend', text);
        include.remove();
        if (typeof AOS !== 'undefined') {
          AOS.refresh();
        }
      });
    }

    function load_file(filename, callback) {
      fetch(filename).then(response => response.text()).then(text => callback(text));
    }
  </script>
</body>

</html>
