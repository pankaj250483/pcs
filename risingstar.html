<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pankaj Computers</title>
  
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/pcs.png">

  <script src="https://kit.fontawesome.com/3744db1db6.js" crossorigin="anonymous"></script>
  
  <!-- Vue 3 & AOS JS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <style>
    body {
      background-color: #ffffff !important;
    }

    .bg-dark {
      background-color: #1E5681 !important;
      color: #ffffff !important;
    }

    .col-md-4.bg-dark h3,
    .col-md-4.bg-dark p,
    .col-md-4.bg-dark span {
      color: #ffffff !important;
    }

    .col-md-4 img.w-100 {
      margin: 15px;
      border-radius: 5%;
      width: calc(100% - 30px) !important;
    }
    
    .h-fix {
       object-fit: cover; 
    }
  </style>
</head>

<body oncontextmenu="return false;" class="noselect">

  <!-- HEADER -->
  <include src="header.html"></include>

  <div class="container-fluid pt-3 bg-blue">
    <div class="row justify-content-around text-center">
      <div class="col-md-10 p-0">
        <p class="brain-text">Our Rising Stars</p>
      </div>
    </div>
  </div>

  <div class="container-fluid text-center py-2 bg-blue sticky-top">
    <a href="risingstar.html" class="btn btn-light rounded-pill px-4 py-2 m-2">Rising Star (Page-1)</a>
    <a href="risingstar2.html" class="btn btn-light rounded-pill px-4 py-2 m-2">Rising Star (Page-2)</a>
    <a href="risingstar3.html" class="btn btn-light rounded-pill px-4 py-2 m-2">Rising Star (Page-3)</a>
  </div>

  <div class="container-fluid">
    <div class="row justify-content-around text-center">
      <div class="col-md-9 py-3">
        <iframe class="w-100" style="height: 650px;" src="https://www.youtube.com/embed/LtpaEVarflU?si=Q-IkyaSskQqLq45G"
          title="YouTube video player" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Vue Mount Element -->
  <div id="app">
    <div class="container-fluid p-5">
      <div class="row g-4 justify-content-around text-center">
        <div 
          v-for="card in cards" 
          :key="card.id" 
          class="col-md-4"
          data-aos="fade-up"
        >
          <div class="bg-dark text-white h-100 p-0">
            <img :src="card.image" alt="Awarding Certificate" class="w-100 h-fix mb-5">
            <h3>AWARDING CERTIFICATE</h3>
            <p class="p-5">{{ card.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- footer -->
  <include src="footer.html"></include>

  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous">
  </script>

  <!-- JS Codes -->
  <script>
    // 1. Vue App Definition
    const { createApp, nextTick } = Vue;

    createApp({
      data() {
        return {
          cards: [
            {
              id: 1,
              image: 'images/c51.jpeg',
              description: 'Founder & Managing Director Mr. Pankaj Ojha awarding certificate to Ms. Sunita for completing Course of Financial Accounting.'
            },
            {
              id: 2,
              image: 'images/c45.jpeg',
              description: 'Founder & Managing Director Mr. Pankaj Ojha awarding certificate to Mr. Arun Soni for completing Course of Computer Application and Financial Accounting.'
            },
            {
              id: 3,
              image: 'images/c52.jpeg',
              description: 'Founder & Managing Director Mr. Pankaj Ojha awarding certificate to Ms. Preet kaur for completing Course of Computer Application.'
            },
            {
              id: 4,
              image: 'images/c46.jpeg',
              description: 'Director Mrs. Sonia Ojha awarding certificate to Ms. Navneet Kaur for completing Course of Computer Application.'
            },
            {
              id: 5,
              image: 'images/c49.jpeg',
              description: 'Centre Head Miss. Geet Sharma awarding certificate to Mr. Vijaylakshmi for completing Course of Financial Accounting.'
            },
            {
              id: 6,
              image: 'images/c47.jpeg',
              description: 'Director Mrs. Sonia Ojha awarding certificate to Ms. Navdeep Kaur for completing Course of Financial Accounting.'
            },
            {
              id: 7,
              image: 'images/c48.jpeg',
              description: 'Founder & Managing Director Mr. Pankaj Ojha awarding certificate to Mr. Arshdeep Singh for completing Course of Financial Accounting.'
            },
            {
              id: 8,
              image: 'images/c50.png',
              description: 'Founder & Managing Director Mr. Pankaj Ojha awarding certificate to Mr. Danish Verma for completing Course of Financial Accounting.'
            }
          ]
        };
      },
      mounted() {
        this.$nextTick(() => {
          AOS.init({
            duration: 800,
            once: true
          });
        });
      }
    }).mount('#app');

    let includes = document.getElementsByTagName('include');
    for (var i = 0; i < includes.length; i++) {
      let include = includes[i];
      load_file(includes[i].attributes.src.value, function (text) {
        include.insertAdjacentHTML('afterend', text);
        include.remove();
        if (typeof AOS !== 'undefined') {
          AOS.refresh();
        }
      });
    }

    function load_file(filename, callback) {
      fetch(filename).then(response => response.text()).then(text => callback(text));
    }
  </script>
</body>

</html>
