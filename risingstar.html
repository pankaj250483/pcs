<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pankaj Computers - Our Rising Stars</title>
  
  <!-- Bootstrap CSS -->
  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/pcs.png">

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/3744db1db6.js" crossorigin="anonymous"></script>
  
  <!-- Vue 3 & AOS JS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <style>
    body {
      background-color: #ffffff !important;
    }

    .bg-dark {
      background-color: #1E5681 !important;
      color: #ffffff !important;
    }

    .col-md-4.bg-dark h3,
    .col-md-4.bg-dark p,
    .col-md-4.bg-dark span {
      color: #ffffff !important;
    }

    .col-md-4 img.w-100 {
      margin: 15px;
      border-radius: 5%;
      width: calc(100% - 30px) !important;
    }
    
    .h-fix {
       object-fit: cover; 
    }
  </style>
</head>

<body oncontextmenu="return false;" class="noselect">

  <!-- HEADER -->
  <include src="header.html"></include>

  <!-- Vue App Element -->
  <div id="app">
    <div class="container-fluid pt-3 bg-blue">
      <div class="row justify-content-around text-center">
        <div class="col-md-10 p-0">
          <p class="brain-text">Our Rising Stars</p>
        </div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="container-fluid text-center py-2 bg-blue sticky-top">
      <button 
        v-for="page in totalPages" 
        :key="page" 
        @click="changePage(page)"
        :class="['btn rounded-pill px-4 py-2 m-2', currentPage === page ? 'btn-primary' : 'btn-light']"
      >
        Rising Star (Page-{{ page }})
      </button>
    </div>

    <!-- Dynamic Sections Loop (Cards & Interspersed Videos) -->
    <template v-for="(section, sIndex) in activeSections" :key="sIndex">
      
      <!-- Video Section -->
      <div v-if="section.type === 'video'" class="container-fluid my-4">
        <div class="row justify-content-around text-center">
          <div class="col-md-9 py-3">
            <iframe 
              class="w-100" 
              style="height: 650px;" 
              :src="section.url"
              title="YouTube video player" 
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
            <div v-if="section.subtitle" class="mt-2">
              <span class="text-warning"><br>{{ section.subtitle }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Cards Grid Section -->
      <div v-else-if="section.type === 'cards'" class="container-fluid p-5">
        <div class="row g-4 justify-content-around text-center">
          <div 
            v-for="card in section.items" 
            :key="card.id" 
            class="col-md-4"
            data-aos="fade-up"
          >
            <div class="bg-dark text-white h-100 p-0">
              <img :src="card.image" alt="Awarding Certificate" class="w-100 h-fix mb-5">
              <h3>AWARDING CERTIFICATE</h3>
              <p class="p-5">
                {{ card.description }}
                <span v-if="card.placement" class="text-warning">
                  <br>{{ card.placement }}
                </span>
              </p>
            </div>
          </div>
        </div>
      </div>

    </template>
  </div>

  <!-- FOOTER -->
  <include src="footer.html"></include>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous">
  </script>

  <!-- Vue & AOS Handler -->
  <script>
    const { createApp, nextTick } = Vue;

    createApp({
      data() {
        return {
          currentPage: 1,
          totalPages: 3,
          pageData: {}
        };
      },
      computed: {
        activeSections() {
          return this.pageData[this.currentPage]?.sections || [];
        }
      },
      methods: {
        changePage(pageNumber) {
          this.currentPage = pageNumber;
          
          // Smooth scroll back to top of content when switching pages
          window.scrollTo({ top: 0, behavior: 'smooth' });

          // Re-initialize/refresh AOS animations on page switch
          this.$nextTick(() => {
            if (typeof AOS !== 'undefined') {
              AOS.refreshHard();
            }
          });
        }
      },
      mounted() {
        // Load risingstar.json file dynamically
        fetch('risingstar.json')
          .then(response => response.json())
          .then(data => {
            this.pageData = data;
            
            // Initialize AOS once elements are rendered in DOM
            this.$nextTick(() => {
              AOS.init({
                duration: 800,
                once: true
              });
            });
          })
          .catch(error => console.error("Error fetching risingstar.json:", error));
      }
    }).mount('#app');

    // Header/Footer include script
    let includes = document.getElementsByTagName('include');
    for (var i = 0; i < includes.length; i++) {
      let include = includes[i];
      load_file(includes[i].attributes.src.value, function (text) {
        include.insertAdjacentHTML('afterend', text);
        include.remove();
        if (typeof AOS !== 'undefined') {
          AOS.refresh();
        }
      });
    }

    function load_file(filename, callback) {
      fetch(filename).then(response => response.text()).then(text => callback(text));
    }
  </script>
</body>

</html>
